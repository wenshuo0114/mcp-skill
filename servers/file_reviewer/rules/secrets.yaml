category_id: secrets
category: 密钥与凭据硬编码
description: 把密码、令牌、私钥、数据库连接串直接写死在代码或配置里。
rules:
  - id: SEC001
    name: 私钥文件内容
    languages: [any]
    pattern: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    severity: 严重
    literal: 'BEGIN PRIVATE KEY（开始 私有 密钥）：这是私钥文件的固定开头标记'
    plain: '代码里直接贴了一把私钥。私钥相当于门钥匙本身，拿到它的人可以冒充你登录服务器、解密数据或签名。'
    consequence: '任何能看到这个文件的人（包括仓库公开后的所有人）都能直接使用这把钥匙，无需破解。'
    authority: ['CWE-321 使用硬编码密钥', 'CWE-798 使用硬编码凭据', 'OWASP A07:2021 身份认证失效']
    is_script: false
    exploit_sensitive: true

  - id: SEC002
    name: AWS 访问密钥 ID
    languages: [any]
    pattern: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
    severity: 严重
    literal: 'AKIA…（亚马逊云 访问 密钥 标识）：AWS 账户的访问密钥编号'
    plain: '这是亚马逊云账号的钥匙编号，通常和另一段秘密密钥配对使用。泄露后别人可以用你的账号开机器、读数据、产生账单。'
    consequence: '云账号被盗用，可能被挖矿刷费、数据被拖走。'
    authority: ['CWE-798 使用硬编码凭据', 'OWASP A02:2021 加密机制失效']
    is_script: false
    exploit_sensitive: true

  - id: SEC003
    name: GitHub 令牌
    languages: [any]
    pattern: '\b(ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{20,}\b'
    severity: 严重
    literal: 'ghp_…（GitHub 个人 令牌）：GitHub 个人访问令牌'
    plain: '这是登录 GitHub 的通行证，别人拿到就能以你的身份读写仓库、删代码、发包。'
    consequence: '仓库被篡改、被植入恶意代码、被删除；影响所有依赖你代码的人。'
    authority: ['CWE-798 使用硬编码凭据']
    is_script: false
    exploit_sensitive: true

  - id: SEC004
    name: 通用密钥/令牌赋值
    languages: [any]
    pattern: '(?i)\b(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key|password|passwd|pwd)\b\s*[:=]\s*["''][^"''\s]{8,}["'']'
    severity: 高
    literal: 'api_key / secret / token / password（接口 密钥 / 秘密 / 令牌 / 密码）= "……"：把凭据以明文赋值给变量'
    plain: '代码里明写了密码或密钥。哪怕是测试用的，一旦提交到仓库，历史记录里永远都在，删掉也能翻回来。'
    consequence: '凭据泄露；如果是生产凭据，会被直接登录、盗取数据或冒充调用付费接口。'
    authority: ['CWE-798 使用硬编码凭据', 'CWE-259 使用硬编码密码', 'OWASP A07:2021']
    is_script: false
    exploit_sensitive: true

  - id: SEC005
    name: 数据库连接串含密码
    languages: [any]
    pattern: '(?i)\b(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqp|mssql):\/\/[^:\/\s]+:[^@\/\s]{3,}@'
    severity: 高
    literal: 'mysql://用户:密码@主机（数据库协议://用户名:口令@地址）：带口令的数据库地址'
    plain: '数据库的地址、账号、密码全写在一行里。拿到这行的人可以直接连上数据库读改删。'
    consequence: '数据库被拖库、被删表、用户隐私外泄。'
    authority: ['CWE-798 使用硬编码凭据', 'OWASP A02:2021 加密机制失效']
    is_script: false
    exploit_sensitive: true

  - id: SEC006
    name: Slack / Discord Webhook 或令牌
    languages: [any]
    pattern: '(hooks\.slack\.com\/services\/T[A-Za-z0-9]+\/B[A-Za-z0-9]+\/[A-Za-z0-9]+|xox[bpoas]-[0-9A-Za-z-]{10,}|discord(app)?\.com\/api\/webhooks\/[0-9]+\/[A-Za-z0-9_-]+)'
    severity: 高
    literal: 'hooks.slack.com/services/…（Slack 钩子地址）：能直接往群里发消息的地址'
    plain: '这个地址等于一个"可以往你们群里发消息"的钥匙，别人拿到能冒充系统发钓鱼消息。'
    consequence: '被冒名发消息、被刷屏、群成员被钓鱼。'
    authority: ['CWE-798 使用硬编码凭据']
    is_script: false
    exploit_sensitive: true

  - id: SEC007
    name: JWT 令牌明文
    languages: [any]
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    severity: 中
    literal: 'eyJ….eyJ….（JSON 网页 令牌 三段式）：一枚已签发的登录令牌'
    plain: '这是某个用户的登录凭证本身，有效期内拿到就等于登录了那个账号。'
    consequence: '账号被接管（在令牌过期前）。'
    authority: ['CWE-522 凭据保护不足']
    is_script: false
    exploit_sensitive: true
