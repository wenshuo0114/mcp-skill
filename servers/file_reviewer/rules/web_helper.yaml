category_id: web_helper
category: 网页辅助性漏洞（HTML / CSS / TS / JS 页面组件）
description: 页面组件里把不可信内容直接塞进网页、缺少来源校验、外链没加防护。单看每一条都"只是小问题"，组合起来就是完整的攻击链。
default_disposition: 必须修复
rules:
  - id: WH001
    name: innerHTML / outerHTML 直接赋值
    languages: [javascript, typescript, html]
    pattern: '\.(innerHTML|outerHTML)\s*(\+)?=\s*(?!["''`]\s*["''`])'
    severity: 高
    literal: 'element.innerHTML = 变量（元素.内部HTML = …）：把字符串直接当 HTML 插进页面'
    plain: '如果这个字符串里有一部分来自用户（评论、昵称、网址参数），用户就能往你的页面里塞脚本，在其他访问者的浏览器里运行。'
    consequence: '跨站脚本（XSS）：偷 Cookie、冒充用户操作、篡改页面。'
    authority: ['CWE-79 跨站脚本', 'OWASP A03:2021 注入']
    is_script: false
    exploit_sensitive: false

  - id: WH002
    name: document.write / insertAdjacentHTML
    languages: [javascript, typescript, html]
    pattern: '\b(document\.write(ln)?|insertAdjacentHTML)\s*\('
    severity: 高
    literal: 'document.write(…)（文档.写入）：向页面直接写 HTML'
    plain: '和 innerHTML 一样的问题，写法不同。'
    consequence: 'XSS。'
    authority: ['CWE-79 跨站脚本']
    is_script: false
    exploit_sensitive: false

  - id: WH003
    name: React dangerouslySetInnerHTML / Vue v-html
    languages: [javascript, typescript, html]
    pattern: '(dangerouslySetInnerHTML|\bv-html\s*=|\[innerHTML\]\s*=|bypassSecurityTrust(Html|Script|Style|Url|ResourceUrl))'
    severity: 高
    literal: 'dangerouslySetInnerHTML（危险地设置内部HTML）/ v-html：框架特意标了"危险"的直插 HTML 方式'
    plain: '框架把它命名为"dangerously"就是在提醒你：这里绕过了自动防护。内容必须是完全可信或经过净化的。'
    consequence: 'XSS。'
    authority: ['CWE-79 跨站脚本']
    is_script: false
    exploit_sensitive: false

  - id: WH004
    name: '内联事件处理 / javascript: 协议'
    languages: [html, javascript, typescript, md]
    pattern: '(?i)(\son(click|load|error|mouseover|focus|submit|change|input)\s*=\s*["''][^"'']*["'']|href\s*=\s*["'']\s*javascript:|src\s*=\s*["'']\s*javascript:)'
    severity: 中
    literal: 'onclick="…" / href="javascript:…"（点击时=… / 链接=脚本：）：把脚本直接写在 HTML 属性里'
    plain: '脚本写在标签属性里，没法用内容安全策略（CSP）保护，也容易被拼进用户内容。'
    consequence: 'XSS；阻碍启用 CSP。'
    authority: ['CWE-79', 'OWASP A05:2021 安全配置错误']
    is_script: false
    exploit_sensitive: false

  - id: WH005
    name: postMessage 未校验来源
    languages: [javascript, typescript]
    pattern: '(postMessage\([^)]*,\s*["'']\*["'']\)|addEventListener\(\s*["'']message["''][^\n]*\)(?![^\n]*origin))'
    severity: 高
    literal: 'postMessage(数据, "*")（发消息（数据，任意目标））/ 监听 message 未检查 event.origin：跨窗口通信不看对方是谁'
    plain: '页面之间传消息时没确认对方身份。任何网页都能把你的页面嵌进去，发假消息或收走你发的数据。'
    consequence: '跨窗口数据泄露 / 伪造指令。'
    authority: ['CWE-345 来源校验不足', 'CWE-346 来源验证错误']
    is_script: false
    exploit_sensitive: false

  - id: WH006
    name: 外链未加 rel="noopener noreferrer"
    languages: [html, javascript, typescript, md]
    pattern: '(?i)<a\s+[^>]*target\s*=\s*["'']_blank["''](?![^>]*rel\s*=\s*["''][^"'']*noopener)[^>]*>'
    severity: 低
    literal: '<a target="_blank">（链接 目标=新窗口）未加 rel="noopener"'
    plain: '新开的页面能拿到你页面的窗口引用，把你的页面偷偷跳到钓鱼站。加上 rel="noopener noreferrer" 即可。'
    consequence: '反向标签劫持（tabnabbing）。'
    authority: ['CWE-1022 不受信任的新窗口访问', 'OWASP 反向标签劫持']
    is_script: false
    exploit_sensitive: false
    disposition: 建议修复

  - id: WH007
    name: 未净化的 URL 参数直接使用
    languages: [javascript, typescript]
    pattern: '((location\.(search|hash|href)|URLSearchParams\([^)]*\)\.get\([^)]*\)|window\.name)\b[^\n]*(innerHTML|eval|document\.write|location\s*=|\.src\s*=|open\()|(innerHTML|document\.write|\.src)\s*[=(][^\n]*(location\.(search|hash|href)|URLSearchParams|window\.name)\b)'
    severity: 高
    literal: 'location.search → innerHTML（地址栏参数 → 直接插入页面）'
    plain: '网址里的参数是任何人都能改的。直接拿来插页面或跳转，别人发你一个链接就能控制你的页面。'
    consequence: '反射型 XSS / 开放重定向。'
    authority: ['CWE-79', 'CWE-601 开放重定向']
    is_script: false
    exploit_sensitive: false

  - id: WH008
    name: CSS 加载外部资源 / 表达式
    languages: [css, html]
    pattern: '(@import\s+(url\()?["'']?https?://|url\(\s*["'']?https?://(?!(fonts\.googleapis\.com|fonts\.gstatic\.com))|expression\s*\(|-moz-binding\s*:|behavior\s*:\s*url)'
    severity: 中
    literal: '@import url("https://…")（导入 外部样式）/ expression()（表达式）：样式表加载外部内容或执行脚本'
    plain: 'CSS 也能从外面拉东西，外部样式表可以改你页面的一切、伪装登录框、甚至读取输入。老式 expression() 直接就是脚本。'
    consequence: '页面被外部样式控制；钓鱼伪装；旧浏览器代码执行。'
    authority: ['CWE-829 包含不可信控制域的功能', 'OWASP A08:2021']
    is_script: false
    exploit_sensitive: false

  - id: WH009
    name: 缺少 Subresource Integrity
    languages: [html]
    pattern: '(?i)<(script|link)\s+[^>]*(src|href)\s*=\s*["'']https?://[^"'']+["''](?![^>]*integrity=)[^>]*>'
    severity: 低
    literal: '<script src="https://cdn…">（脚本 来源=外部 CDN）未加 integrity 校验'
    plain: '从 CDN 加载脚本时没写指纹（integrity）。CDN 上的文件一旦被换，你的页面照单全收。'
    consequence: 'CDN 被入侵时页面被劫持。'
    authority: ['CWE-353 缺少完整性校验', 'W3C 子资源完整性（SRI）']
    is_script: false
    exploit_sensitive: false
    disposition: 建议修复

  - id: WH010
    name: localStorage 存放令牌
    languages: [javascript, typescript]
    pattern: '(?i)localStorage\.setItem\(\s*["''][^"'']*(token|jwt|secret|password|session)[^"'']*["'']'
    severity: 中
    literal: 'localStorage.setItem("token", …)（本地存储.设置（"令牌"，…））：把登录令牌放在网页本地存储里'
    plain: '本地存储任何脚本都能读。页面只要有一处 XSS，令牌就被拿走。放在 HttpOnly Cookie 里更安全。'
    consequence: 'XSS 时令牌被盗、账号被接管。'
    authority: ['CWE-922 敏感信息存储不安全', 'OWASP A07:2021']
    is_script: false
    exploit_sensitive: false

  - id: WH011
    name: 隐藏 iframe / 不可见元素加载外部内容
    languages: [html, javascript, typescript]
    pattern: '(?i)(<iframe[^>]*(width\s*=\s*["'']?0|height\s*=\s*["'']?0|display\s*:\s*none|visibility\s*:\s*hidden|opacity\s*:\s*0)[^>]*src\s*=\s*["'']https?://|<iframe[^>]*src\s*=\s*["'']https?://[^>]*(width\s*=\s*["'']?0|height\s*=\s*["'']?0|display\s*:\s*none))'
    severity: 高
    literal: '<iframe src="https://…" style="display:none">（内嵌框架 来源=外部 隐藏）：看不见的框架在加载别人的网页'
    plain: '页面里藏了一个看不见的窗口在加载外部网页。用途通常是：偷偷刷流量、点击劫持、暗中加载挖矿或追踪脚本。'
    consequence: '隐藏行为；用户被利用而不知情。'
    authority: ['CWE-1021 不当限制渲染 UI 层（点击劫持）', 'CWE-506']
    is_script: false
    exploit_sensitive: false
    disposition: 必须删除
